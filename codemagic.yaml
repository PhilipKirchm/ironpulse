workflows:
  ios-build:
    name: Build iOS App
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web app
        script: |
          npm run build
      - name: Update iOS platform
        script: |
          npm run ios:sync
      - name: Build iOS app
        script: |
          cd ios/App
          xcodebuild clean
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -derivedDataPath build \
            -destination "generic/platform=iOS"
      - name: Create IPA
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -derivedDataPath build \
            -archivePath build/App.xcarchive \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/ios-release
    artifacts:
      - ios/App/build/ios-release/*.ipa
