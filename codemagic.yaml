workflows:
  ios-build:
    name: IronPulse iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install Node dependencies
        script: npm install

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor to iOS
        script: npx cap sync ios

      - name: Show iOS project structure
        script: |
          echo "=== ios/App contents ==="
          ls -la ios/App/
          echo "=== Xcode projects/workspaces ==="
          find ios/App -name "*.xcworkspace" -o -name "*.xcodeproj" | head -20

      - name: Build iOS (unsigned)
        script: |
          cd ios/App

          # Use xcworkspace if it exists (SPM), otherwise xcodeproj
          if [ -d "App.xcworkspace" ]; then
            echo "Building with App.xcworkspace (SPM)"
            xcodebuild \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -derivedDataPath build \
              -archivePath build/IronPulse.xcarchive \
              -destination "generic/platform=iOS" \
              archive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "Building with App.xcodeproj (SPM fallback)"
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -derivedDataPath build \
              -archivePath build/IronPulse.xcarchive \
              -destination "generic/platform=iOS" \
              archive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          fi

          echo "=== Archive contents ==="
          ls -la build/IronPulse.xcarchive/Products/Applications/ || true

          # Copy .app for download
          mkdir -p build/ipa-export
          cp -r build/IronPulse.xcarchive/Products/Applications/App.app \
            build/ipa-export/ || true
          echo "Build done!"

    artifacts:
      - ios/App/build/ipa-export/*.app
      - ios/App/build/IronPulse.xcarchive/**
