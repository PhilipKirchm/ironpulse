workflows:
  ios-build:
    name: IronPulse iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Node dependencies
        script: npm install

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor to iOS
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Build iOS (unsigned)
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -derivedDataPath build \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color || true

      - name: Archive & export IPA (unsigned)
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -derivedDataPath build \
            -archivePath build/IronPulse.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

          mkdir -p build/ipa-export
          cp -r build/IronPulse.xcarchive/Products/Applications/App.app \
            build/ipa-export/ || true

    artifacts:
      - ios/App/build/ipa-export/*.app
      - ios/App/build/IronPulse.xcarchive/**
