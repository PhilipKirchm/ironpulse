<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c30"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="ip" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="924" y2="0">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#30d158"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <g id="mark" fill="url(#ip)" stroke="url(#ip)">
      <!-- Hantelscheiben (links, rechts gespiegelt) -->
      <rect x="100" y="282" width="72" height="460" rx="34" stroke="none"/>
      <rect x="190" y="346" width="60" height="332" rx="30" stroke="none"/>
      <rect x="268" y="446" width="36" height="132" rx="16" stroke="none"/>
      <rect x="852" y="282" width="72" height="460" rx="34" stroke="none"/>
      <rect x="774" y="346" width="60" height="332" rx="30" stroke="none"/>
      <rect x="720" y="446" width="36" height="132" rx="16" stroke="none"/>
      <!-- Stange als Pulsschlag -->
      <path d="M304 512 H390 L428 452 L462 512 H494 L536 296 L592 730 L642 512 H720"
            fill="none" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <use href="#mark" filter="url(#glow)" opacity="0.65"/>
  <use href="#mark"/>
</svg>
